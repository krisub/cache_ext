# YCSB Workload D: 95% Read, 5% Insert (Latest distribution)
# Read-latest: recent inserts are read most often. Tests temporal locality.
database:
  key_size: 16
  value_size: 200
  nr_entry: 536870912

workload:
  nr_warmup_op: 10000000
  warmup_runtime_seconds: 30
  runtime_seconds: 120
  nr_op: 10000000
  nr_thread: 8
  next_op_interval_ns: 0
  operation_proportion:
    read: 0.95
    update: 0
    insert: 0.05
    scan: 0
    read_modify_write: 0
  request_distribution: "latest"
  zipfian_constant: 0.99
  scan_length: 100

net_leveldb:
  addr: "127.0.0.1"
  port: 9100
