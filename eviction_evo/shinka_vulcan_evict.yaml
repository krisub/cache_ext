# ── ShinkaEvolve config for cache_ext vulcan-style eviction policy ────
# Evolves a BPF page-cache eviction policy that uses kernel-libvulcan
# listener abstractions (MinMax, EWMA, RollingWindow, Average) and
# score-based sampling instead of boolean iterate callbacks.
#
# Run: python run_evo.py --config_path shinka_vulcan_evict.yaml

max_evaluation_jobs: 1
max_proposal_jobs: 2
max_db_workers: 2

db_config:
  num_islands: 1
  archive_size: 30
  elite_selection_ratio: 0.3
  num_archive_inspirations: 3
  num_top_k_inspirations: 2
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: crowding
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
    loc: -0.1

  enable_dynamic_islands: false
  stagnation_threshold: 15
  island_spawn_strategy: best
  island_spawn_subtree_size: 2

evo_config:
  patch_types:
    - diff
  patch_type_probs:
    - 1.0

  num_generations: 50
  max_api_costs: 15.0
  max_patch_resamples: 5
  max_patch_attempts: 8
  max_novelty_attempts: 4
  job_type: local

  language: c
  init_program_path: LLM.h

  llm_models:
    - "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  llm_kwargs:
    temperatures:
      - 0
      - 0.3
      - 0.6
    reasoning_efforts:
      - low
      - medium
      - high
    max_tokens: 32768

  meta_rec_interval: 5
  meta_llm_models:
    - "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  meta_llm_kwargs:
    temperatures:
      - 0
    max_tokens: 16384

  embedding_model: null
  code_embed_sim_threshold: 1.0

  novelty_llm_models:
    - "us.anthropic.claude-haiku-4-5-20251001-v1:0"
  novelty_llm_kwargs:
    temperatures:
      - 0

  llm_dynamic_selection: ucb1
  llm_dynamic_selection_kwargs:
    exploration_coef: 1.8
    cost_aware_coef: 0.3

  results_dir: results/vulcan_evo

  evolve_prompts: true
  prompt_evolution_interval: 5
  prompt_patch_types: ["diff"]
  prompt_patch_type_probs: [1.0]
  prompt_archive_size: 8
  prompt_percentile_recompute_interval: 1
  prompt_ucb_exploration_constant: 2.0
  prompt_epsilon: 0.4

  # ── Task system message ──────────────────────────────────────────────
  task_sys_msg: |
    You are evolving only the eviction-policy block for a Linux eBPF cache_ext
    program using kernel-libvulcan.

    Goal: maximize throughput. Keep proposals practical and compilable.

    ## Scope and output
    - `LLM.h` is the evolution input; the `EVOLVE-BLOCK` corresponds to the full contents
      of `LLM.h`.
    - Keep required symbols defined: `gf_configs[VULCAN_NUM_GLOBAL_FEATURES]`,
      `folio_cfg`, `SAMPLE_SIZE`, `main_list`, and `bpf_score_fn`.
    - `gf_configs` uses **only** these five indices (sparse init; every other `GF_*`
      stays default-disabled): `GF_SEGS_IN`, `GF_SEGS_OUT`, `GF_BYTES_RECEIVED`,
      `GF_BYTES_ACKED`, `GF_CLIENT_TAG`. Do not add other `GF_*` rows to the initializer.
    - **Networking features must be enabled:** every evolved `LLM.h` MUST set a
      non-zero `listener_mask` (plus valid `ewma_alpha` / `rw_size` when those bits are
      used) on **all four TCP-backed rows** — `GF_SEGS_IN`, `GF_SEGS_OUT`,
      `GF_BYTES_RECEIVED`, `GF_BYTES_ACKED` — so `tcp_recvmsg` runs the collection path
      and per-`client_tag` maps fill. Also enable **`GF_CLIENT_TAG`** (folio path) so
      tag and TCP metrics stay aligned for the same `client_tag`. Do not submit a policy
      that leaves these masks all zero.

    ## Must-keep behavior contracts
    - `bpf_score_fn(struct cache_ext_list_node *a) -> s64` (name may be `node`; keep signature)
      - lower score = evict earlier
      - `INT64_MAX` / `S64_MAX` = protect / never prefer as victim (match `LLM.h`)
      - use `struct folio *folio = a->folio;` (do NOT use `container_of`)
    - `evict_folios` uses `bpf_cache_ext_list_sample(..., bpf_score_fn, ...)`.
    - kprobe / map / include / registration infrastructure outside EVOLVE-BLOCK
      is fixed and must remain compatible.
    - Keep `main_list` as `static u64 main_list;` (do NOT change to pointer types).
    - Keep `gf_configs` and `folio_cfg` as `static const` declarations.

    ## Listener config syntax (important)
    `gf_configs[]` entry type:
    ```c
    struct vulcan_feature_config {
        u32 listener_mask;  // OR of VULCAN_LISTENER_* bits
        u32 ewma_alpha;     // [0..1000] when EWMA is enabled
        u32 rw_size;        // [1..16] when RW is enabled
    };
    ```

    `folio_cfg` type:
    ```c
    struct vulcan_folio_config {
        u32 listener_mask;  // per-folio interval listeners
        u32 ewma_alpha;     // [0..1000] for per-folio EWMA
    };
    ```

    Listener bitmask flags (OR them in `listener_mask`):
    - `VULCAN_LISTENER_MINMAX`
    - `VULCAN_LISTENER_EWMA`
    - `VULCAN_LISTENER_AVG`
    - `VULCAN_LISTENER_RW`
    - `VULCAN_LISTENER_ALL`

    Per-client_tag accessors in scoring (return 0 if listener not enabled or
    `meta->client_tag == 0`). Use them **only** with these feature ids (the ones
    configured in `LLM.h` `gf_configs`):
    - `GF_SEGS_IN`, `GF_SEGS_OUT` — TCP segment totals (in/out load)
    - `GF_BYTES_RECEIVED`, `GF_BYTES_ACKED` — bytes in / bytes acknowledged out
    - `GF_CLIENT_TAG` — tag stream from folio hooks (not sampled in `tcp_recvmsg`)
    - APIs: `vulcan_tag_get_min/max/ewma/avg/latest/kth_recent/window_avg/window_count`
      — args `(meta->client_tag, GF_*)` plus `k` for `kth_recent`.

    Do not design scoring around other `GF_*` enum values; they are not present in
    the evolved `gf_configs` table. Avoid `vulcan_get_*` global accessors for eviction
    (host-wide TCP blend); use `vulcan_tag_get_*` with `meta->client_tag` and the ids above.

    ## Folio metadata and helper usage
    `folio_metadata_map` value has fields such as:
    - `access_count`, `last_access_ts`, `prev_access_ts`
    - `interval_minmax.min_val/max_val`, `interval_ewma.value`
    - `client_tag`

    Use in hooks:
    - initialize with `vulcan_folio_init(now)`
    - update on access with `vulcan_folio_on_access(meta, now, &folio_cfg)`

    ## Safety / verifier constraints (critical)
    - No floating point.
    - Avoid expensive or unverifiable patterns (large loops/stack).
    - Do NOT use signed division in BPF score math.
      - Bad: `(s64_a * 100) / s64_b`
      - Good: prove non-negative, cast to `u64`, then divide; or use shifts.
    - Prefer overflow-safe integer arithmetic and guard zero denominators.
    - Use `S64_MAX` (or `~0ULL` where appropriate), not `UINT64_MAX` in score logic.
    - Never output `<<<<<<<`, `=======`, or `>>>>>>>`.

    ## Compile-error guards:
    These patterns caused `clang` BPF compile failures; do not repeat them.

    - **Global accessor arity** — `vulcan_get_min`, `vulcan_get_max`, `vulcan_get_ewma`,
      `vulcan_get_avg`, and the other `vulcan_get_*` helpers each take **exactly one**
      argument: `u32 feature_id` (a `GF_*` constant). They do **not** accept `meta`,
      folio pointers, or a second numeric argument.
      - Bad (rejected: `too many arguments to function call, expected single argument 'feature_id'`):
        `vulcan_get_ewma(meta, 0)` or `vulcan_get_ewma(something, GF_BYTES_RECEIVED)` with a non-feature first arg.
      - Good (single `feature_id` arg only): `vulcan_get_ewma(GF_BYTES_RECEIVED)`.
      - Preferred for this task: `vulcan_tag_get_ewma(meta->client_tag, GF_BYTES_RECEIVED)`
        (and only the five `GF_*` ids listed above).

    - **Per-client_tag network metrics** — use **`vulcan_tag_get_*`** with **two** args
      `(meta->client_tag, GF_*)` (plus `k` for `vulcan_tag_get_kth_recent`), not `vulcan_get_*`.

    - **Per-folio interval EWMA / minmax** — read from **`meta`** fields updated by
      `vulcan_folio_on_access` when `folio_cfg` enables those listeners, e.g.
      `meta->interval_ewma.value`, `meta->interval_minmax.min_val`. Do not call
      `vulcan_get_ewma` for per-folio intervals; that API is for **global** feature IDs only.

    ## Feature usage guidance (only these five `GF_*` ids)
    - **Required:** non-zero `listener_mask` on all five rows above (networking must
      stay on — see Scope). Choose listener bits and params deliberately.
    - Read per-client data with `vulcan_tag_get_* (meta->client_tag, GF_*, ...)` using
      those same ids only.
    - Disabled listeners return 0; avoid relying on meaningless zeros.
    - Within each required row, enable only the `VULCAN_LISTENER_*` bits you read in
      `bpf_score_fn` (each row must stay non-zero overall so collection stays active).
    - `client_tag` on folios aligns with kprobe port→tag routing for the four TCP-backed ids.
    - Be creative with scoring functions, do not just use the default LFU scoring.
