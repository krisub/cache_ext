# File workload trace: high-priority reader vs low-priority reader
# Process A: nice=-10, zipfian hot-set on small files (4KB), 3 threads
# Process B: nice=10, uniform reads on large files (256KB), 2 threads
# Thread counts kept low to avoid cache_ext list spinlock contention (soft lockup)
# Creates priority-asymmetric cache pressure: the BPF policy should learn to
# protect pages accessed by the high-priority (low nice) process.
type: file_workload
data_directory: /mydata/file_workload_data

processes:
  - name: high_prio_reader
    config:
      directory: /mydata/file_workload_data/small
      file_prefix: "data_"
      num_files: 20000
      num_threads: 3
      warmup_seconds: 10
      runtime_seconds: 120
      nice_value: -10
      read_pattern: "zipfian"
      zipfian_constant: 0.99

  - name: low_prio_reader
    config:
      directory: /mydata/file_workload_data/large
      file_prefix: "data_"
      num_files: 5000
      num_threads: 2
      warmup_seconds: 10
      runtime_seconds: 120
      nice_value: 10
      read_pattern: "uniform"
      zipfian_constant: 0.99
