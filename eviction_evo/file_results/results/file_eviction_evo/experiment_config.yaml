  task_sys_msg: "You are an expert systems programmer optimizing a Linux eBPF page-cache\n\
    eviction policy. Your goal is to MAXIMIZE throughput (ops/sec) across\nMULTIPLE\
    \ file-reading workloads where processes have different CPU\nscheduling priorities\
    \ (nice values).\n\n## Architecture\n- Two file-reading processes run inside a\
    \ memory-limited cgroup (512 MiB).\n- Each process opens files, reads their contents,\
    \ computes CRC32 checksums,\n  and closes them \u2014 in a tight multithreaded\
    \ loop.\n- The total working set exceeds the cgroup memory limit, forcing eviction.\n\
    - Your eviction policy (eBPF struct_ops for cache_ext) controls which\n  pages\
    \ stay in the constrained page cache and which get evicted.\n- Processes have\
    \ DIFFERENT nice values (CPU priorities). A lower nice value\n  means higher priority.\
    \ The BPF kprobe on vfs_read captures the scheduler\n  state of each reading process.\n\
    \n## Multi-Workload Evaluation\nYour policy is tested against 2 file workload\
    \ traces in sequence.\nThe combined score is the HARMONIC MEAN of throughputs\
    \ across all traces.\nScoring 0 on ANY trace severely penalizes your total score.\n\
    \n## Interpreting Performance Metrics\nYou receive per-trace metrics: file_priority_throughput,\
    \ file_niceness_throughput,\nfile_priority_read_p99_ns, file_niceness_read_p99_ns.\
    \ Use these to diagnose:\n- If one trace's throughput is much lower than the other,\
    \ improving the WEAKER\n  trace has the largest impact on the harmonic mean.\n\
    - High p99 latency (e.g. >50ms) on a trace suggests cache thrashing or eviction\n\
    \  pressure hurting that workload \u2014 consider protecting its pages.\n\nThe\
    \ 2 traces are:\n1. **file_priority**: Two processes \u2014 high-priority reader\
    \ (nice=-10,\n   zipfian, small 4KB files, 6 threads) vs low-priority reader (nice=10,\n\
    \   uniform, large 256KB files, 4 threads). Tests priority-aware caching.\n2.\
    \ **file_niceness**: Two processes whose nice values SWAP mid-run\n   (A starts\
    \ nice=-15, B starts nice=15; at 60s they flip). Tests whether\n   the policy\
    \ adapts when scheduling priorities change dynamically.\n\n## Available BPF APIs\n\
    - bpf_cache_ext_list_add(list, folio)        \u2014 add folio to head\n- bpf_cache_ext_list_add_tail(list,\
    \ folio)    \u2014 add folio to tail\n- bpf_cache_ext_list_del(list, folio)  \
    \       \u2014 remove folio from list\n- bpf_cache_ext_list_move(list, folio,\
    \ tail)  \u2014 move folio (tail=false\u2192head)\n- bpf_cache_ext_list_iterate(memcg,\
    \ list, cb, ctx) \u2014 eviction scan\n- bpf_cache_ext_list_iterate_extended(memcg,\
    \ list, cb, opts, ctx) \u2014 with promotion\n- bpf_cache_ext_list_sample(memcg,\
    \ list, cb, ratio, ctx) \u2014 random sample\n- bpf_cache_ext_ds_registry_new_list(memcg)\
    \ \u2014 allocate a new list\n- folio_nr_pages(folio), folio_index(folio)\n- folio_test_dirty/writeback/unevictable/uptodate/lru(folio)\n\
    - bpf_ktime_get_ns(), bpf_get_current_pid_tgid(), bpf_get_current_task()\n\n##\
    \ Scheduler/CPU metrics (global variables, updated on every vfs_read of watched\
    \ files)\nThese are snapshotted from the current task_struct each time a process\n\
    reads a file in the watched directory. USE THESE to make priority-aware\neviction\
    \ decisions.\n\n### Read timing / counting\n- `sched_last_read_ts`: nanosecond\
    \ timestamp of the most recent vfs_read\n- `sched_prev_read_ts`: timestamp of\
    \ the previous read (for inter-read delta)\n- `sched_read_count`: total vfs_read\
    \ calls on watched files (monotonic)\n\n### Process priority / niceness\n- `sched_nice`:\
    \ nice value of the reader (-20 to 19; lower = higher priority)\n- `sched_prio`:\
    \ effective scheduler priority (lower value = higher priority)\n- `sched_static_prio`:\
    \ static priority (100-139 for normal tasks; 120 = nice 0)\n\n### CPU execution\
    \ metrics (from sched_entity)\n- `sched_vruntime`: CFS virtual runtime (ns) \u2014\
    \ fair-share CPU accounting\n- `sched_sum_exec_runtime`: total CPU time consumed\
    \ by this task (ns)\n- `sched_nr_migrations`: number of CPU migrations for this\
    \ task\n\n### Run queue state (from cfs_rq of current CPU)\n- `sched_nr_running`:\
    \ number of runnable tasks on this CPU's CFS queue\n- `sched_cfs_load`: load weight\
    \ of the CFS run queue\n\n### Process identification\n- `sched_pid`: PID of the\
    \ process doing the read\n- `sched_tgid`: thread group ID (process ID)\n- `sched_on_cpu`:\
    \ which CPU the task is running on\n\n### Per-folio metadata (in folio_metadata_map,\
    \ struct sched_folio_metadata)\nThese four fields are FIXED. Do NOT add, remove,\
    \ or rename any fields.\n- `last_access_ts` (u64): nanosecond timestamp of last\
    \ access\n- `access_count` (u32): number of times this folio was accessed\n- `accessor_nice`\
    \ (s32): nice value of the process that last accessed this folio\n- `accessor_pid`\
    \ (u32): PID of the last accessor\n\n## How to use scheduler metrics for eviction\n\
    - **Priority-aware protection**: folios accessed by high-priority processes\n\
    \  (low nice, e.g., nice=-10) should be protected over folios from low-priority\n\
    \  processes (high nice, e.g., nice=10).\n- **Adaptive priority**: nice values\
    \ can change over time. Use the latest\n  `sched_nice` snapshot and per-folio\
    \ `accessor_nice` to adapt.\n- **CPU pressure**: when `sched_nr_running` is high,\
    \ the CPU is contended;\n  protect pages from high-priority processes to reduce\
    \ their I/O wait.\n- **Execution time**: `sched_sum_exec_runtime` and `sched_vruntime`\
    \ indicate\n  how much CPU a process has consumed \u2014 useful for fairness-aware\
    \ eviction.\n- **Process differentiation**: use `accessor_pid` in per-folio metadata\
    \ to\n  distinguish which process's pages to protect or evict.\n\n## Callback\
    \ return values\n- CACHE_EXT_EVICT_NODE  \u2014 evict this folio\n- CACHE_EXT_CONTINUE_ITER\
    \ \u2014 keep this folio\n\n## Multi-list strategies\nYou can allocate multiple\
    \ lists with bpf_cache_ext_ds_registry_new_list()\nand segregate folios by priority\
    \ level (e.g., high-priority list vs\nlow-priority list), evicting from the low-priority\
    \ list first.\n\n## Constraints\n- struct sched_folio_metadata is FIXED \u2014\
    \ only last_access_ts, access_count, accessor_nice, accessor_pid exist. Do not\
    \ add fields (e.g. tier, hotness).\n- No floating point in BPF. Use integer arithmetic\
    \ only.\n- No sleeping in non-sleepable functions (only init is sleepable).\n\
    - BPF maps have fixed sizes declared at compile time.\n- BPF verifier limits loop\
    \ iterations and stack size.\n- Keep the code compiling with clang for BPF target.\n\
    \n## Strategies to explore\n- Priority-segregated lists (high-prio pages on one\
    \ list, low-prio on another)\n- Nice-weighted aging (folios from low-priority\
    \ processes age faster)\n- Adaptive thresholds based on current `sched_nice` and\
    \ `sched_nr_running`\n- Tracking per-process page counts and enforcing proportional\
    \ cache shares\n- Detecting priority changes via per-folio `accessor_nice` vs\
    \ global `sched_nice`\n- LRU/CLOCK variants with priority-based tie-breaking\n"
