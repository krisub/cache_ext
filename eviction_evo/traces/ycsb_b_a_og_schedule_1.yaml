type: dual_client
clients:
  - name: client_ycsb_b
    host: "krisub@node1"
    config:
      database:
        key_size: 16
        value_size: 1024
        nr_entry: 536870912
      workload:
        nr_warmup_op: 10000000
        warmup_runtime_seconds: 10
        runtime_seconds: 120
        nr_op: 100000000
        nr_thread: 8
        next_op_interval_ns: 0
        rate_schedule_file: "../schedules/og_window_10000_40000.csv"
        operation_proportion:
          read: 0.95
          update: 0.05
          insert: 0
          scan: 0
          read_modify_write: 0
        request_distribution: "zipfian"
        zipfian_constant: 0.99
        scan_length: 100
      net_leveldb:
        addr: "10.10.1.1"
        port: 9100
      measurement:
        latency_file: ""

  - name: client_ycsb_a
    host: "krisub@node1"
    config:
      database:
        key_size: 16
        value_size: 1024
        nr_entry: 536870912
      workload:
        nr_warmup_op: 10000000
        warmup_runtime_seconds: 10
        runtime_seconds: 120
        nr_op: 100000000
        nr_thread: 8
        next_op_interval_ns: 0
        rate_schedule_file: "../schedules/og_window_40000_70000.csv"
        operation_proportion:
          read: 0.5
          update: 0.5
          insert: 0
          scan: 0
          read_modify_write: 0
        request_distribution: "zipfian"
        zipfian_constant: 0.99
        scan_length: 100
      net_leveldb:
        addr: "10.10.1.1"
        port: 9100
      measurement:
        latency_file: ""
