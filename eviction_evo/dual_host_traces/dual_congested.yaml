# Dual-client trace: both clients remote on node1
# Both clients connect to node0 server over real network.
type: dual_client

clients:
  - name: wan_reader
    host: "krisub@node1"
    config:
      database:
        key_size: 16
        value_size: 200
        nr_entry: 536870912
      workload:
        nr_warmup_op: 10000000
        warmup_runtime_seconds: 30
        runtime_seconds: 120
        nr_op: 10000000
        nr_thread: 4
        next_op_interval_ns: 0
        operation_proportion:
          read: 0.95
          update: 0.05
          insert: 0
          scan: 0
          read_modify_write: 0
        request_distribution: "zipfian"
        zipfian_constant: 0.99
        scan_length: 100
      net_leveldb:
        addr: "10.10.1.1"
        port: 9100
      measurement:
        latency_file: ""

  - name: wan_writer
    host: "krisub@node1"
    config:
      database:
        key_size: 16
        value_size: 1024
        nr_entry: 536870912
      workload:
        nr_warmup_op: 10000000
        warmup_runtime_seconds: 30
        runtime_seconds: 120
        nr_op: 10000000
        nr_thread: 4
        next_op_interval_ns: 0
        operation_proportion:
          read: 0.5
          update: 0
          insert: 0
          scan: 0
          read_modify_write: 0.5
        request_distribution: "zipfian"
        zipfian_constant: 0.99
        scan_length: 100
      net_leveldb:
        addr: "10.10.1.1"
        port: 9100
      measurement:
        latency_file: ""
