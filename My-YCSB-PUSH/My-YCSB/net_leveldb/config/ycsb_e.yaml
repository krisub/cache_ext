# YCSB Workload E: 95% Scan, 5% Insert (Zipfian)
# For use with net_leveldb_server (page-cache-friendly networked LevelDB)

database:
  key_size: 16
  value_size: 200
  nr_entry: 536870912

workload:
  nr_warmup_op: 10000000
  warmup_runtime_seconds: 45
  runtime_seconds: 240
  nr_op: 10000000
  nr_init_thread: 1
  nr_thread: 8
  next_op_interval_ns: 0
  operation_proportion:
    read: 0
    update: 0
    insert: 0.05
    scan: 0.95
    read_modify_write: 0
  request_distribution: "zipfian"
  zipfian_constant: 0.99
  scan_length: 100

measurement:
  latency_file: ""

net_leveldb:
  addr: "127.0.0.1"
  port: 9100
